<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山梨地域バスロケーション（リアルタイム）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<style>
html,body{height:100%;overflow:hidden} header{height:54px;display:flex;align-items:center}
header h1{font-size:clamp(16px,2.6vw,22px)} #map{height:calc(100vh - 145px)}
#status{padding:6px 10px;background:#fff;border-top:1px solid #ddd;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.bus-icon{width:60px;text-align:center;position:relative}.bus-icon img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 1px 2px #777)}
.bus-number{position:absolute;bottom:-1px;left:0;right:0;background:#fff;border:1px solid #777;border-radius:4px;font-weight:bold;font-size:12px}
.bus-delay{position:absolute;top:-4px;right:-2px;background:#fff;color:#c00;border-radius:4px;font-size:11px;font-weight:bold;padding:1px 3px}
@media(max-width:600px){header{padding:0 8px}#search-area{gap:5px;padding:6px}#search-area button{padding:0 9px}#map{height:calc(100vh - 145px)}}
</style>
</head>
<body>
<header><h1>山梨地域バス車番照会システム</h1></header>
<div id="search-area">
<input id="searchBox" type="text" placeholder="車番・ナンバーで検索">
<button id="searchButton">検索</button><button id="clearButton">解除</button>
</div>
<div id="map"></div>
<div id="status"><span id="busCount">車両数：--</span><span id="updateTime">更新：--</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body></html>
